name: publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-homebrew-dotfiles
  cancel-in-progress: false

jobs:
  homebrew:
    if: github.repository == 'jinyongp/dotfiles' && github.ref == 'refs/heads/main'
    uses: jinyongp/homebrew-tap/.github/workflows/publish-formula.yml@main
    with:
      formula: dotfiles
      ref: ${{ github.sha }}
    secrets:
      deploy_key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
